{% set name = "pyphen" %}
{% set version = "0.18.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dbae6fbbe4f01cb206108b43573d857c67107be9d0e38eb1b08d6fa2210634a7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - flit-core >=3.2,<5
    - pip
    - python
  run:
    - python

test:
  source_files:
    - tests
    - pyphen
  imports:
    - pyphen
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -v --tb=short tests

about:
  home: https://pyphen.org
  license: GPL-2.0-or-later AND LGPL-2.1-or-later AND MPL-1.1
  license_family: Other
  license_file:
    - LICENSE
    - COPYING.GPL
    - COPYING.LGPL
    - COPYING.MPL
  summary: Pure Python module to hyphenate text
  description: |
    Pyphen is a pure Python module to hyphenate text using existing Hunspell
    hyphenation dictionaries.
  doc_url: https://doc.courtbouillon.org/pyphen
  dev_url: https://github.com/Kozea/Pyphen

extra:
  recipe-maintainers:
    - liZe
    - rmax
    - thewchan
